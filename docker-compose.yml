version: '3.8'

services:
  # app(내 코드)와 db(데이터베이스)가 정의됨
  # 데이터베이스
  db:
    image: postgres:15  # 포스트그리 15 버전 이미지를 가져옴
    restart: always  # 도커가 예상치 못하게 꺼지면 도커가 알아서 켬
    environment:  # DB 접속을 위한 아이디, 비밀번호, 생성할 DB 이름 설정
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accounts
    ports:
      - "5432:5432"
    volumes:  
      - ./postgres_data:/var/lib/postgresql/data 
      # 컨테이너는 삭제되면 내부 데이터도 삭제됨 -> 컴퓨터의 ./postgres_data 폴더와 컨테이너 안의 DB 저장소를 연결하여 
      # 컨테이너를 지워도 데이터는 컴퓨터에 안전하게 남도록 함

  # 백엔드(spring boot)
  backend:
    build: ./backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/accounts
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db
    ports:
      - "8080:8080"

  # 프론트엔드(Vue.js)
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend